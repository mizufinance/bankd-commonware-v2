[package]
name = "cw-counter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.86"
description = "Counter contract to verify CosmWasm on bankd"

# Standalone workspace, like light-clients/cw-commonware.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# no iterator: the host storage is unordered
cosmwasm-std = { version = "2.2", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
