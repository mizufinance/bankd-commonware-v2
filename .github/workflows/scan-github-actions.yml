name: Scan GitHub Actions

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: actionlint@1.7.12
      - name: Check workflow syntax
        run: actionlint
      - uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          inputs: .github/workflows .github/actions
          advanced-security: false
          version: v1.30.1
      - name: Test CI helpers
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash .github/scripts/bench-state-test.sh
          bash .github/scripts/bench-upload-charts-test.sh
          node --test .github/scripts/docker-pr.test.js .github/scripts/docker-pr-status.test.js .github/scripts/bench-log-summary.test.js
