name: Specs

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "tips/verify/**"
      - "crates/alloy/**"
      - "crates/chainspec/**"
      - "crates/contracts/**"
      - "crates/dkg-onchain-artifacts/**"
      - "crates/evm/**"
      - "crates/hardfork/**"
      - "crates/precompiles/**"
      - "crates/precompiles-macros/**"
      - "crates/primitives/**"
      - "crates/revm/**"
      - "scripts/foundry-patch.sh"
      - ".github/workflows/specs.yml"
      - ".github/actions/**"
  merge_group:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check-specs-changes:
    name: Check specs changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.specs }}
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            specs:
              # Dependency updates can change native precompile behavior without Rust source changes.
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'tips/verify/**'
              - 'crates/alloy/**'
              - 'crates/chainspec/**'
              - 'crates/contracts/**'
              - 'crates/dkg-onchain-artifacts/**'
              - 'crates/evm/**'
              - 'crates/hardfork/**'
              - 'crates/precompiles/**'
              - 'crates/precompiles-macros/**'
              - 'crates/primitives/**'
              - 'crates/revm/**'
              - 'scripts/foundry-patch.sh'
              - '.github/workflows/specs.yml'
              - '.github/actions/**'

  build:
    name: Forge Build
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: nightly

      - name: Run Forge build
        working-directory: tips/verify
        run: forge build --sizes

  abi-alignment-check:
    name: ABI Alignment Check
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: nightly

      - name: Build tempo-std interfaces
        working-directory: tips/verify/lib/tempo-std
        run: forge build --sizes

      - name: Run ABI alignment check
        run: cargo run -p tempo-xtask -- check-abi

  lint:
    name: Forge Fmt
    needs: check-specs-changes
    if: needs.check-specs-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: nightly

      - name: Run Forge fmt check
        working-directory: tips/verify
        run: forge fmt --check

  specs-success:
    name: specs success
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
    needs:
      - check-specs-changes
      - build
      - abi-alignment-check
      - lint
    timeout-minutes: 5
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Decide whether the needed jobs succeeded or failed
        run: python3 .github/scripts/check-ci-needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.check-specs-changes.outputs.should_run != 'true' && 'build,abi-alignment-check,lint' || '' }}
