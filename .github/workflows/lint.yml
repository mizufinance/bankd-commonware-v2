name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

# One job so we pay for checkout, toolchain and cache setup once.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init shieldd
        run: git submodule update --init --depth 1 --recursive shieldd
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - name: Install toolchains
        run: |
          rustup component add clippy
          rustup target add riscv32imac-unknown-none-elf
          rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.15.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny,zepter,typos,cargo-hack
      - name: Install RISC-V C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      # Light checks, no compiling.
      - parallel:
          - name: fmt
            run: cargo +nightly fmt --all --check
          - name: typos
            run: typos
          - name: deny
            run: cargo deny check
          - name: zepter
            run: |
              cargo metadata --format-version=1 --all-features --locked > /dev/null
              zepter run check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
        env:
          RUSTFLAGS: -D warnings
          CARGO_BUILD_JOBS: 4
      - name: no-std
        run: .github/scripts/check_no_std.sh
        env:
          CC_riscv32imac_unknown_none_elf: riscv64-unknown-elf-gcc
      - name: feature powerset
        if: github.event_name == 'push'
        run: cargo hack check --feature-powerset --depth 1
