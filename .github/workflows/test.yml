name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "180"
  RUST_BACKTRACE: full
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # Some tests run into stack overflows with jemalloc
  RUST_MIN_STACK: 8388608

# One job so the workspace only compiles once.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Init shieldd
        run: git submodule update --init --depth 1 --recursive shieldd
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.15.0
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest@0.9.127
      - parallel:
          - name: tempoup installer tests
            run: |
              sudo apt-get install -y shellcheck
              bash -n tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
              shellcheck tempoup/tempoup tempoup/install tempoup/test-tempoup.sh
              ./tempoup/test-tempoup.sh
          - name: Build tests
            run: cargo nextest run --profile ci -E 'not (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/))' --no-run
      - name: Run tests
        run: cargo nextest run --profile ci -E 'not (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/))'
      - name: Run flaky e2e tests
        continue-on-error: true
        run: cargo nextest run --profile ci-flaky
      - name: Warn about flaky e2e tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .github/scripts/warn_flaky_e2e.py target/nextest/ci/junit.xml
      - name: Generate genesis
        run: |
          cargo xtask generate-genesis \
            --accounts 100 \
            --no-dkg-in-genesis \
            --output generated \
            --coinbase 0xbba20Bb99dA4E103721B754b25071Fc85e7028A1
          diff -u crates/node/tests/assets/test-genesis.json generated/genesis.json
      - name: CLI smoke tests
        run: |
          cargo build --bin tempo
          ./scripts/test-cli.sh
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30
