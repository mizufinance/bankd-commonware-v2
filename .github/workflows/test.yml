name: Test

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_HTTP_TIMEOUT: "180"
  RUST_BACKTRACE: full

jobs:
  genesis:
    name: Genesis generation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
      - name: Generate genesis
        run: |
          cargo xtask generate-genesis \
            --accounts 100 \
            --no-dkg-in-genesis \
            --output generated \
            --coinbase 0xbba20Bb99dA4E103721B754b25071Fc85e7028A1
      - name: Compare with existing test genesis
        run: |
          # Compare the generated genesis with the existing test-genesis.json
          if ! diff -u crates/node/tests/assets/test-genesis.json generated/genesis.json; then
            echo "Generated genesis differs from existing test-genesis.json"
            echo "Please update the test-genesis.json file with the generated content"
            exit 1
          else
            echo "Generated genesis matches test-genesis.json"
          fi

  test:
    name: test (${{ matrix.partition }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest@0.9.127
      - name: Build and compile tests
        run: cargo nextest run --profile ci -E 'not (package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2 --no-run
      - name: Run tests
        run: cargo nextest run --profile ci -E 'not (package(tempo-e2e) | (package(tempo-node) & binary(it) & test(/test_matrices_(testnet|devnet)/)))' --partition count:${{ matrix.partition }}/2

  e2e:
    name: e2e (${{ matrix.partition }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    env:
      # Set to 8 MiB because some tests run into stack overflows with jemalloc
      RUST_MIN_STACK: 8388608
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest@0.9.127
      - name: Test flaky e2e reporter
        continue-on-error: true
        run: python3 -m unittest discover -s .github/scripts -p 'test_warn_flaky_e2e.py'
      - name: Build e2e tests
        run: cargo nextest run -p tempo-e2e --profile ci -E 'not test(can_restart_after_joining_from_snapshot)' --partition slice:${{ matrix.partition }}/4 --no-run
      - name: Run e2e tests
        run: cargo nextest run -p tempo-e2e --profile ci -E 'not test(can_restart_after_joining_from_snapshot)' --partition slice:${{ matrix.partition }}/4
      - name: Warn about flaky e2e tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 .github/scripts/warn_flaky_e2e.py target/nextest/ci/junit.xml
      - name: Upload e2e test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  e2e-flaky:
    name: e2e-flaky
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
    env:
      RUST_MIN_STACK: 8388608
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: nextest@0.9.127
      - name: Build flaky e2e tests
        run: cargo nextest run -p tempo-e2e --profile ci-flaky --no-run
      - name: Run flaky e2e tests
        run: cargo nextest run -p tempo-e2e --profile ci-flaky

  cli:
    name: CLI smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
      - name: Build tempo
        run: cargo build --bin tempo
      - name: Run CLI tests
        run: ./scripts/test-cli.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- actionlint does not support $/ action references yet
        with:
          toolchain: "1.96" # MSRV
      - name: Build with MSRV
        run: cargo build --bin tempo
        env:
          RUSTFLAGS: -D warnings

  test-success:
    name: test success
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
    needs:
      - test
      - e2e
      - cli
      - msrv
      - genesis
    timeout-minutes: 120
    steps:
      - name: Secure runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Decide whether the needed jobs succeeded or failed
        run: python3 .github/scripts/check-ci-needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ""
