[package]
name = "tempo-tendermint-verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Stateless CometBFT light client verification (wraps ibc-contracts tendermint-light-client crates)"

[dependencies]
tendermint-light-client-update-client = { path = "../../contracts/lib/ibc-contracts/packages/tendermint-light-client/update-client" }
tendermint-light-client-membership = { path = "../../contracts/lib/ibc-contracts/packages/tendermint-light-client/membership" }
tendermint-light-client-misbehaviour = { path = "../../contracts/lib/ibc-contracts/packages/tendermint-light-client/misbehaviour" }
ibc-client-tendermint = { version = "0.57", default-features = false }
ibc-core-commitment-types = { version = "0.57", default-features = false }
ibc-core-client-types = { version = "0.57", default-features = false }
ibc-core-host-types = { version = "0.57", default-features = false }
tendermint = { version = "0.40", default-features = false }
prost = { version = "0.13", default-features = false }
thiserror.workspace = true

[features]
test-utils = ["dep:serde", "dep:serde_json", "dep:hex"]

[dependencies.serde]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[dependencies.hex]
version = "0.4"
optional = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
hex = "0.4"
