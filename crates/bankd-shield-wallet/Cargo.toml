[package]
name = "bankd-shield-wallet"
description = "Dev wallet that builds and proves shieldd txs for bankd v2 as 0x77 envelopes"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "bankd-shield-wallet"
path = "src/main.rs"

# Built on its own (`cargo build -p bankd-shield-wallet`) so the proving key
# features don't leak into the node binary through feature unification.
[dependencies]
shieldd-sdk-app = { path = "../../shieldd/crates/core/app", features = ["parallel"] }
shieldd-sdk-asset = { path = "../../shieldd/crates/core/asset" }
shieldd-sdk-keys = { path = "../../shieldd/crates/core/keys" }
shieldd-sdk-mock-client = { path = "../../shieldd/crates/test/mock-client" }
shieldd-sdk-num = { path = "../../shieldd/crates/core/num" }
shieldd-sdk-proto = { path = "../../shieldd/crates/proto" }
shieldd-sdk-shielded-pool = { path = "../../shieldd/crates/core/component/shielded-pool", features = ["component"] }
shieldd-sdk-transaction = { path = "../../shieldd/crates/core/transaction", features = ["parallel"] }
# Patched at the workspace root (vendored cnidarium, mizufinance decaf377 fork).
cnidarium = { version = "0.83", features = ["migration"] }
decaf377 = "0.10.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }

alloy-rlp.workspace = true
anyhow = "1"
clap.workspace = true
const-hex.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
